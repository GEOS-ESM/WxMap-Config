AOT_off: &AOT_OFF
  - 0.00 1.0 1.0
  - 0.50 1.0 1.0
  - 1.00 1.0 1.0

AOT_on: &AOT_ON
  - 0.000 0.000 0.000
  - 0.080 1.000 1.000
  - 1.000 1.000 1.000

wxmapschem2d:

  plot:
    bcaot:
      black_carbon_aot:
        cdict: bcaotcdict
        clevs:
        nsub: 10
        skip: 10
        alpha: *AOT_ON
      map:
        layers: [shader-GryWht]
