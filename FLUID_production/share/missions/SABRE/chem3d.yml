        clevs:
        expr: 1000000000000 * _cfc12trop

  layer:

    shading: &SHADING
      gxout: shaded
      cbar: EPRainbow
      nsub: 10
      skip: 10
      type: linear

    contours:
      gxout: contour
      csmooth: 'off'
      cthick: 1
      ccolor: 0 0 0
      cint: 25

    streamlines:
      gxout: stream
      uexpr: _uwnd
      vexpr: _vwnd
      ccolor: 0 0 0
      cthick: 1
      strmden: 1

  attribute:

    tm_valid: '%m/%d/%Y %HZ'
    tm_verif: '%A %d %B %Y %HUTC'
    tm_start: '%m/%d/%Y %HZ'
    tm_string: 'Initial: $tm_start &b&b&b Hour: $tau &b&b&b Valid: $tm_valid'
  
    cbar:
      orient:
        coral_lg:  0
        coral_sm:  0
        global:    0
        australia: 0
        usa:       0
        shout:     0
        pac:       0
        posidon:   0
  
    streamlines:
      default: 1
      global:  0
      nps: 0
      sps: 0

    bccdict:
