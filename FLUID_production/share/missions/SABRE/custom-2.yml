  layer:

    shading:
      gxout: shaded
      cbar: smoke01
    # cbunits: '--auto'
      nsub: 10
      skip: 10
      cmin: 0
      cmax: 100
      cint: 10
      scale:
      alpha:
        - 0.000 0.000 0.000
        - 0.050 1.000 1.000
        - 1.000 1.000 1.000

    heights:
      gxout: contour
      expr: smth9(_h/10)
      cint: hcint
      clab: masked
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    zpbl:
      gxout: contour
      expr: _zpbl
      cint: 100
      clab: masked
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    temperature:
      gxout: contour
      expr: _t-273.15
      cint: 1 
      clab: masked
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    uwind:
      gxout: contour
      expr: _u
      cint: ucint
      clab: masked
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    vwind:
      gxout: contour
      expr: _v
      cint: vcint
      clab: masked 
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    slp:
      gxout: contour
      expr: smth9(_slp/100)
      cint: 3
      clab: masked
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    ps:
      gxout: contour
      expr: _ps/100
      cint: 35
      clab: masked
      cthick: 5
      ccolor: 0 0 0
      clsize: 0.10

    barbs: 
      gxout: barb
      uexpr: _u*1.94384
      vexpr: _v*1.94384
      skip: 0
      size: 0.05
      ccolor: 0 0 0
      cthick: 3

