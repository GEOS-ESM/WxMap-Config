        nsub: 10
        skip: 10
        alpha: *AOT_ON
      map:
        layers: [shader-GryWht]

    bcocsmass:
      long_name: BC+OC Sfc Mass
      levels: [0]
      layers: [bcoc_surface_mass]
      title: '\\\\ BR+BC+OC Surface Mass [`3m`f13g/m`a3`n]'

    bcoccmass:
      long_name: BC+OC Col Mass
      levels: [0]
      layers: [bcoc_column_mass, streamlines]
      title: '\\\\ BR+BC+OC Column Mass [mg/m`a2`n]'
      streamlines:
        uexpr: (_bcfluxu+_ocfluxu)/(_bccmass+_occmass)
        vexpr: (_bcfluxv+_ocfluxv)/(_bccmass+_occmass)

    bcocaot:
      long_name: BC+OC AOT
      levels: [0]
      layers: [blackorganic_carbon_aot, streamlines]
      title: '\\\\ Black + Organic Carbon AOT'
      streamlines:
        uexpr: (_bcfluxu+_ocfluxu)/(_bccmass+_occmass)
        vexpr: (_bcfluxv+_ocfluxv)/(_bccmass+_occmass)

  layer:

    streamlines:
      gxout: stream
      uexpr: _uwnd
      vexpr: _vwnd
      ccolor: 0 0 0
      cthick: 1
      strmden: 1

    blackorganic_carbon_aot:
      gxout: shaded
      expr: _bcexttau+_ocexttau
      cbar: smoke01
      clevs:
      cdict: bcocaotcdict
      scale:
      cmin: 0
      cmax: 2
      cint: 0.2
      nsub: 10
      skip: 10

    bcoc_surface_mass:
      gxout: shaded
      expr: (_brsmass+_bcsmass+_ocsmass)*1.0e+9
      cbar: smoke01
      clevs:
      cdict: bcocsmasscdict
      scale:
      cmin: 0
      cmax: 60
      cint: 5
      nsub: 10
      skip: 10

    bcoc_column_mass:
      gxout: shaded
      expr: (_brcmass+_bccmass+_occmass)*1.0e+6
      cbar: smoke01
      cbunits: '[mg/m`a2`n]'
      clevs:
      cdict: bcoccmasscdict
      scale:
      cmin: 0
      cmax: 500
      cint: 50
      nsub: 10
      skip: 10

    pm25:
      gxout: shaded
      expr: _pm25sfc
      cbar: smoke01
      cbunits: '`3m`0`f13g/m`a3`n'
      clev:
      cdict: pm25sfccdict
      scale:

  attribute:

    bcaotcdict:
      - {'$level': 0, cmin: 0.0, cmax: 0.08, cint: 0.01, scale: exp_scale}
    bcocaotcdict:
      - {'$level': 0, cmin: 0.0, cmax: 0.4, cint: 0.04, scale: exp_scale}
    bcoccmasscdict:
