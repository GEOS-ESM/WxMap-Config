wxmapscustom-2:

  plot:

    no2sfc:
      long_name: NO2 Sfc
      title: 'Surface NO`b2'
      levels: [0]
      layers: [no2sfc]
      map:
        layers: [shader-GryWht]

    so2sfc:
      long_name: SO2 Sfc
      title: 'Surface SO`b2'
      levels: [0]
      layers: [so2sfc]
      map:
        layers: [shader-GryWht]

    cosfc:
      long_name: CO Sfc
      title: 'Surface CO'
      levels: [0]
      layers: [cosfc]
      map:
        layers: [shader-GryWht]
      
    o3sfc:
      long_name: O3 Sfc
      title: 'Surface O`b3'
      levels: [0]
      layers: [o3sfc] 
      map:
        layers: [shader-GryWht]

    hchosfc:
      long_name: HCHO Sfc
      title: 'Surface HCHO'
      levels: [0]
      layers: [hchosfc]
      map:
        layers: [shader-GryWht]

  layer:

    no2sfc:
      gxout: shaded
      expr: 1.0e+9 * _no2sfc
      cbar: CET-R1
      cbunits: '[PPBV]'
    # clevs: 0 0.01 0.02 0.05 0.1 0.2 0.5 1 2 5 10 15 20 50
      clevs:
      cmin: 0
      cmax: 80
      cint: 8
      scale: exp_scale
      nsub: 20
      skip: 20
      alpha: 
        - 0.000 0.000 0.000
        - 0.050 1.000 1.000
        - 1.000 1.000 1.000

    so2sfc:
      gxout: shaded
      expr: 1.0e+9 * _so2sfc
      cbar: CET-R1
      scale:
      cbunits: '[PPBV]'
    # clevs: 0 0.01 0.02 0.05 0.1 0.2 0.5 1 2 5 10 15 20 50 100
      clevs:
      cmin: 0
      cmax: 20
      cint: 2
      nsub: 20
      skip: 20
      alpha:
        - 0.000 0.000 0.000
        - 0.050 0.000 0.000
        - 0.300 1.000 1.000
        - 1.000 1.000 1.000

    cosfc:
      gxout: shaded
      expr: 1.0e+9 * _cosfc
      cbar: CET-R1
      cbunits: '[PPBV]'
      cmin: 0
      cmax: 500
      cint: 50
      scale:
      nsub: 20
      skip: 20
      alpha:
        - 0.000 0.000 0.000
        - 0.100 0.000 0.000
        - 0.300 1.000 1.000
        - 1.000 1.000 1.000

    o3sfc:
      gxout: shaded
      expr: 1.0e+9 * _o3sfc
      cbar: CET-R1
      cbunits: '[PPBV]'
#     clevs: 0 0.01 0.02 0.05 0.1 0.2 0.5 1 2 5 10 15 20 50 100
      clevs:
      cmin: 0
      cmax: 100
      cint: 10
      scale: log_scale
      nsub: 20
      skip: 20

    hchosfc:
      gxout: shaded
      expr: 1.0e+9 * _hchosfc
      cbar: CET-R1
      cbunits: '[PPBV]'
      clevs:
      cmin: 0
      cmax: 5.0
      cint: 0.5
#     scale: log_scale
      nsub: 10
      skip: 10
