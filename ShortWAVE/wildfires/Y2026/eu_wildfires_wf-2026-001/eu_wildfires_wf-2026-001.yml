stream:

  CONUS2KM:
    long_name: GEOS CONUS 2KM Replay
    description: GEOS CONUS 2KM Replay
    type: analysis
    downloading: enabled
    access: public
    uri: /discover/nobackup/projects/gmao/osse2/HWT/CONUS02KM/Feature-c2160_L137/holding/inst1_2d_asm_Nx/%Y%m/Feature-c2160_L137.inst1_2d_asm_Nx.%Y%m%d_%H%Mz.nc4
    service: !!python/object/apply:dataservice.GEOSDDF []
    animation: enabled
    max_frames: 20
    institution: NASA - Global Modeling and Assimilation Office (GMAO)
    reference: http://gmao.gsfc.nasa.gov/GEOS/geos5/index_pubs.php
    link: http://gmao.gsfc.nasa.gov/GEOS
    logos: [nasa-logo-ul, gmao-logo-ur]

  CONUS2KMFC:
    long_name: GEOS CONUS 2KM Forecast
    description: GEOS CONUS 2KM Forecast
    type: forecast
    downloading: enabled
    access: public
    uri: /discover/nobackup/projects/gmao/osse2/HWT/CONUS02KM/Feature-c2160_L137/forecasts/CYCLED_REPLAY_P10800_C21600_T21600_%%Y%%m%%d_%%Hz/GEOS.$collection.%Y%m%d_%H%Mz.nc4
    service: !!python/object/apply:dataservice.GEOSDDF []
    animation: enabled
    max_frames: 20
    institution: NASA - Global Modeling and Assimilation Office (GMAO)
    reference: http://gmao.gsfc.nasa.gov/GEOS/geos5/index_pubs.php
    link: http://gmao.gsfc.nasa.gov/GEOS
    logos: [nasa-logo-ul, gmao-logo-ur]

field:
  
  CONUS2KM: &CONUS2KM_ptr

    _brexttau:
      long_name: Brown Carbon Extinction AOT [550 nm]
      units: '1'
      expression: brexttau.inst1_2d_asm_Nx(z=1)

  CONUS2KMFC: *CONUS2KM_ptr

map:

  NE_10m_Admin0:
    shape_file: Natural_Earth/ne_10m_admin_0_countries
    line_width: 2
    zorder: -1
    
  NE_10m_Coastline: 
    shape_file: Natural_Earth/ne_10m_coastline
    line_width: 2
    zorder: -1
  
  NE_10m_Lakes: 
    shape_file: Natural_Earth/ne_10m_lakes
    line_width: 2
    zorder: -1

  map-smoke:
    file: /discover/nobackup/jardizzo/maps/BlueMarble/SmokeForecastBasemap_200407.3x21600x10800.png
    service: SmokeForecastBasemap_200407.3x21600x10800
    line_color: 0 0 0 100
    line_width: 2
    water_color: 0 0 0 0
    land_color: 0 0 0 0
    layers: [water, land, lsmask, NE_10m_Lakes, NE_10m_Admin0]

  Wildfires:
    shape_file: Wildfires/Y2026/eis_%Y%m%d
    line_width: 10
    line_color: 255 0 0
    fill_color: 255 0 0
    zorder: -1

region:

  europe:

    long_name: Europe
    lon: -180 180
    lat: 5 90
    mpdset: newmap
    mproj: nps
    mpvals: -28 36 29 75

  europe-2:
    long_name: Europe
    lon: -10 20
    lat: 25 40
    mpdset: hires
    mproj: latlon
    frame: 'off'

  global:

    long_name: Global
    lon: -180 180
    lat: -90 90
    mpdset: lowres
    mproj: scaled
    mpvals:
    frame: 'off'

theme:

  plot:

    smoke:
      long_name: Aerosols
      levels: [0]
      layers: [brexttau]
      title: 'AOT'
      parea: 0 11 0 8.5
      map:
        frame: 'off'
        layers: [map-smoke]

  layer:

    brexttau:
      gxout: shaded
      expr: _brexttau
      cbar: Colorbar_14C
      cbunits:
      clevs:
      cmin: 0
      cmax: 0.5
      cint: 0.05
      nsub: 10
      skip: 10
      scale:
      alpha:
        - 0.00 0.0 0.0
        - 0.10 1.0 1.0
        - 1.00 1.0 1.0

